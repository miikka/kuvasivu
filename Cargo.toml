[package]
name = "kuvasivu"
version = "0.1.0"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
askama = "0.15"
image = { version = "0.25", default-features = false, features = ["avif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["redactions"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Image decoding, resizing and AVIF encoding are 10-100x slower unoptimized,
# which makes `cargo run` unusable for browsing albums. rav1e's generic encoder
# code is instantiated in this crate, so it needs some optimization too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
